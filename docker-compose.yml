version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: vesper-backend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env
      - ./credentials:/app/credentials
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - GCP_PROJECT_ID=reetik-project
      - FIREBASE_DATABASE_ID=vesper-db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/backend-sa-key.json
      - STORAGE_BUCKET_VIDEOS=vesper-birthday-videos-reetik-project
      - STORAGE_BUCKET_ASSETS=vesper-birthday-assets-reetik-project
      - CORS_ORIGIN=http://localhost:5173
    networks:
      - vesper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vesper-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000/api
    networks:
      - vesper-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  vesper-network:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:
